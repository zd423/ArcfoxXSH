name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -list -project ArcfoxXSH.xcodeproj

      - name: Build archive (unsigned)
        id: build
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ArcfoxXSH.xcodeproj \
            -scheme ArcfoxXSH \
            -archivePath build/ArcfoxXSH.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee build.log

      - name: Show xcodebuild errors
        if: failure()
        run: |
          echo "::group::build.log tail"
          tail -n 60 build.log
          echo "::endgroup::"
          # Emit at most 10 annotations (GitHub drops extras); most useful first.
          { grep -E "error:|BUILD FAILED|ARCHIVE FAILED|The following build commands failed|requires a development team|Signing for|No profiles for|fatal error" build.log | head -n 4 || true
            echo "--- last 4 lines of build.log ---"
            tail -n 4 build.log
          } | sed 's/^/::error::/'

      - name: Package IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -R build/ArcfoxXSH.xcarchive/Products/Applications/ArcfoxXSH.app Payload/
          zip -qry ArcfoxXSH-unsigned.ipa Payload

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArcfoxXSH-unsigned-ipa
          path: ArcfoxXSH-unsigned.ipa
          retention-days: 7
